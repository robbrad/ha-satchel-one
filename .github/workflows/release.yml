name: Release - Publish

on:
  push:
    tags:
      - '*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set release version
        run: echo "RELEASE_VERSION=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV

      - name: Verify manifest version matches tag
        run: |
          MANIFEST_VERSION=$(python -c "import json;print(json.load(open('custom_components/satchel_one/manifest.json'))['version'])")
          if [ "$MANIFEST_VERSION" != "${{ env.RELEASE_VERSION }}" ]; then
            echo "Error: manifest version ($MANIFEST_VERSION) does not match tag (${{ env.RELEASE_VERSION }})"
            exit 1
          fi

      - name: Build HACS zip
        run: |
          cd custom_components/satchel_one
          zip -r "$GITHUB_WORKSPACE/satchel_one.zip" . -x '*__pycache__*'

      - name: Create GitHub release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.RELEASE_VERSION }}
          generateReleaseNotes: true
          # bump.yml already releases its own tags; stay idempotent for the
          # manual-tag case rather than failing on an existing release.
          allowUpdates: true
          artifacts: "satchel_one.zip"
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create workflow summary
        if: always()
        run: |
          echo "## Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: ${{ env.RELEASE_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Release**: https://github.com/${{ github.repository }}/releases/tag/${{ env.RELEASE_VERSION }}" >> $GITHUB_STEP_SUMMARY
