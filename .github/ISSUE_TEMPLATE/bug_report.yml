name: Bug report
description: Something in the Satchel One integration is not working
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste your Satchel One password, tokens, cookies or a child's
        personal details into this form.** Redact logs before posting.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what did you get instead?
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Integration version
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: ha-version
    attributes:
      label: Home Assistant version
      placeholder: "2026.9.0"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: |
        Enable debug logging, reproduce, then paste the log. **Redact**
        usernames, passwords, tokens and pupil names first.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I have removed all credentials and personal data from this report
          required: true
        - label: I am running the latest release of this integration
          required: true
